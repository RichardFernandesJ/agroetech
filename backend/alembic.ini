# Configuração do Alembic para o backend do Agro & Tech.
#
# A URL do banco NÃO fica neste arquivo: `alembic/env.py` lê
# AGRO_DATABASE_URL (ou a opção `sqlalchemy.url` passada por programação).
# Assim credenciais nunca são versionadas.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Timestamp com fuso horário nos nomes das revisões.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
